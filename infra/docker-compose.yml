services:
  postgres:
    image: postgres:16-alpine
    container_name: medichannel-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-medichannel}
      POSTGRES_USER: ${POSTGRES_USER:-medichannel_app}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME_LOCAL_ONLY}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-medichannel_app} -d ${POSTGRES_DB:-medichannel}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
