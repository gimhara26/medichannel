server:
  port: ${SERVER_PORT:8080}
  forward-headers-strategy: framework

spring:
  application:
    name: medichannel-api
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/medichannel}
    username: ${DB_USERNAME:medichannel_app}
    password: ${DB_PASSWORD:CHANGE_ME_LOCAL_ONLY}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: Asia/Colombo
  jackson:
    time-zone: Asia/Colombo

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  frontend-url: ${FRONTEND_URL:http://localhost:3000}
  jwt:
    secret: ${JWT_SECRET:}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:30}
  encryption:
    key-base64: ${APP_ENCRYPTION_KEY_BASE64:}
  hmac:
    key-base64: ${APP_HMAC_KEY_BASE64:}
  initial-admin:
    name: ${INITIAL_ADMIN_NAME:System Administrator}
    email: ${INITIAL_ADMIN_EMAIL:}
    password: ${INITIAL_ADMIN_PASSWORD:}
